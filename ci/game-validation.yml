name: Game validation (betsson.es)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: game-validation
  cancel-in-progress: false # never cancel a run that may be mid-spin

jobs:
  validate:
    name: betsson.es · both scenarios
    # betsson.es only serves Spain: GitHub-hosted runners (US IPs) will most likely be blocked.
    # Register a self-hosted runner on a machine in Spain and set repository variable RUNNER_LABEL=self-hosted
    # (or set PROXY_SERVER in the environment secrets).
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # Environment "betsson-es" holds the secrets: FUNDED_USER, FUNDED_PASS, EMPTY_USER, EMPTY_PASS
    # (optional PROXY_SERVER, PROXY_USER, PROXY_PASS)
    environment: betsson-es
    timeout-minutes: 30
    env:
      CI: 'true'
      FUNDED_USER: ${{ secrets.FUNDED_USER }}
      FUNDED_PASS: ${{ secrets.FUNDED_PASS }}
      EMPTY_USER: ${{ secrets.EMPTY_USER }}
      EMPTY_PASS: ${{ secrets.EMPTY_PASS }}
      PROXY_SERVER: ${{ secrets.PROXY_SERVER }}
      PROXY_USER: ${{ secrets.PROXY_USER }}
      PROXY_PASS: ${{ secrets.PROXY_PASS }}
      GAME_SLUG: ${{ vars.GAME_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run both scenarios (headed under xvfb on Linux so WebGL renders)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1920x1080x24" npx playwright test --project=betsson.es
          else
            npx playwright test --project=betsson.es
          fi
      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-es
          path: blob-report
          retention-days: 14

  report:
    name: Publish report
    needs: validate
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Build report (checks table + Playwright report)
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports
      - name: Job summary
        run: |
          node -e '
            const r = require("./site/checks.json");
            const out = ["## Game validation · betsson.es", "", `PASS ${r.totals.PASS} · FAIL ${r.totals.FAIL} · INFO ${r.totals.INFO}`, "", "| Scenario | Check | Status | Observed |", "|---|---|---|---|"];
            for (const c of r.rows) out.push(`| ${c.scenario} | ${c.title} | ${c.status} | ${String(c.actual).replace(/\|/g, "/").slice(0, 120)} |`);
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY, out.join("\n"));
          '
      - uses: actions/upload-artifact@v4
        with:
          name: game-validation-report
          path: site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
